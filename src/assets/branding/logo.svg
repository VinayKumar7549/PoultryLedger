<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Master PoultryLedger Logo Asset -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Outer Egg Silhouette -->
  <path
    d="M256 50 C180 50 120 180 120 330 C120 420 180 470 256 470 C332 470 392 420 392 330 C392 180 332 50 256 50 Z"
    fill="#FFFFFF"
    fill-opacity="0.18"
    stroke="#FFFFFF"
    stroke-width="24"
    stroke-linejoin="round"
  />

  <!-- Integrated Ledger Checkmark / Trade Growth Chart -->
  <path
    d="M190 330 L240 380 L340 240"
    stroke="#FFFFFF"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bar Chart Accent Lines -->
  <line x1="170" y1="270" x2="215" y2="270" stroke="#A7F3D0" stroke-width="18" stroke-linecap="round"/>
  <line x1="295" y1="290" x2="340" y2="290" stroke="#A7F3D0" stroke-width="18" stroke-linecap="round"/>
</svg>
